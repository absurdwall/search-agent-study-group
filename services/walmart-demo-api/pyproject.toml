[project]
name = "walmart-demo-api"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "fastmcp[code-mode]==3.4.6",
  "google-cloud-firestore>=2.21,<3",
  "httpx>=0.28,<1",
  "mcp==1.29.0",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
